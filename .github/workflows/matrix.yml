name: Matrix Demo
on: push
jobs:
  build:
    strategy:
      matrix:
        version: [18, 20, 22]
        os: [ubuntu-latest, windows-latest]
        include:
          - version: 24
            os: ubuntu-latest
        exclude:
          - version: 18
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
      - name: Install dependencies
        run: npm ci
      - name: Build projects
        run: npm run build